<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<meta name="description" content="A simple world clock. Search a city or postal code and compare its local time with Egypt.">
<title>Mohsen Tools — World Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c1220;--card:#151f30;--line:#29364b;--text:#f4f7fc;--muted:#9baac0;--accent:#8ee5d4;--purple:#b8aaff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px 'DM Sans',sans-serif}
main{width:min(900px,calc(100% - 32px));margin:0 auto;padding:44px 0 60px}
header{margin-bottom:30px}
.brand{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--accent)}
h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.05em;margin:12px 0 8px}
header p{color:var(--muted);line-height:1.6;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.panel h2{font-size:13px;letter-spacing:.1em;margin:0 0 16px;color:#dce5f2}
.search{display:flex;gap:10px}
input{min-width:0;flex:1;background:#0c1422;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:14px;font:inherit;outline:none}
input:focus{border-color:var(--purple)}
button{border:0;border-radius:11px;padding:12px 17px;background:var(--purple);color:#121629;font:700 13px 'DM Sans';cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.status{min-height:22px;color:var(--muted);font-size:12px;margin-top:10px}
.results{display:grid;gap:8px;margin-top:8px}
.result{display:flex;justify-content:space-between;align-items:center;text-align:left;background:#0c1422;border:1px solid var(--line);color:var(--text);width:100%;padding:12px}
.result span{display:block}
.result small{display:block;color:var(--muted);font-weight:400;margin-top:4px}
.clocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.clock{background:#0c1422;border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}
.clock.cairo{border-color:#4a756e}
.cityline{display:flex;justify-content:space-between;gap:10px;align-items:center}
.city{font-weight:700;font-size:15px}
.zone{font-size:11px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.time{font:600 clamp(27px,5vw,34px) 'IBM Plex Mono',monospace;letter-spacing:-.06em;margin:19px 0 5px}
.date{font-size:11px;color:var(--muted)}
.diff{display:inline-block;margin-top:14px;padding:6px 9px;border-radius:20px;background:#1b3440;color:var(--accent);font-size:11px;font-weight:700}
.remove{padding:6px 9px;background:#263044;color:#c7d2e3;font-size:11px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{background:#222d42;color:#dce5f2;font-weight:600}
.empty{color:var(--muted);font-size:13px;line-height:1.6}
footer{text-align:center;color:#6f7f96;font-size:11px;padding-top:10px}
@media(max-width:560px){main{padding-top:28px}.panel{padding:16px}.search{flex-direction:column}.search button{width:100%}.clocks{grid-template-columns:1fr 1fr}.clock{padding:13px}.time{font-size:25px}}
@media(max-width:360px){.clocks{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<div class="brand">MOHSEN TOOLS</div>
<h1>World Clock</h1>
<p>Check the time anywhere and compare it with Egypt.</p>
</header>

<section class="panel">
<h2>SEARCH FOR A CITY OR POSTAL CODE</h2>
<form class="search" id="searchForm">
<input id="query" autocomplete="off" placeholder="e.g. London, New York, 10001" aria-label="City, address or postal code" required>
<button id="searchButton">Search</button>
</form>
<div class="status" id="status" aria-live="polite">Search for a place to add its clock.</div>
<div class="results" id="results"></div>
</section>

<section class="panel">
<h2>YOUR CLOCKS</h2>
<div class="clocks" id="clocks">
<article class="clock cairo" id="egyptClock"></article>
</div>
</section>

<section class="panel">
<h2>POPULAR CITIES</h2>
<div class="quick" id="quick"></div>
</section>

<footer>Time data uses your browser's time-zone database. Place search uses OpenStreetMap.</footer>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const EGYPT='Africa/Cairo';
const PHOTON='https://photon.komoot.io/api/';
const HOURORA='https://hourora.app/api/v1';
const popular=[
{name:'Alexandria',country:'Egypt',zone:'Africa/Cairo',lat:31.2001,lon:29.9187},
{name:'London',country:'United Kingdom',zone:'Europe/London',lat:51.5072,lon:-0.1276},
{name:'New York',country:'United States',zone:'America/New_York',lat:40.7128,lon:-74.006},
{name:'Dubai',country:'UAE',zone:'Asia/Dubai',lat:25.2048,lon:55.2708},
{name:'Riyadh',country:'Saudi Arabia',zone:'Asia/Riyadh',lat:24.7136,lon:46.6753},
{name:'Tokyo',country:'Japan',zone:'Asia/Tokyo',lat:35.6762,lon:139.6503},
{name:'Paris',country:'France',zone:'Europe/Paris',lat:48.8566,lon:2.3522},
{name:'Los Angeles',country:'United States',zone:'America/Los_Angeles',lat:34.0522,lon:-118.2437}
];
let places=readSaved();
function readSaved(){try{const v=JSON.parse(localStorage.getItem('mohsen_simple_clocks')||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function save(){try{localStorage.setItem('mohsen_simple_clocks',JSON.stringify(places))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parts(date,zone){const o={};new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date).forEach(x=>{if(x.type!=='literal')o[x.type]=+x.value});return o}
function offset(date,zone){const p=parts(date,zone);return Math.round((Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(date.getTime()/1000)*1000)/60000)}
function offsetText(m){const sign=m>=0?'+':'−',a=Math.abs(m);return 'UTC'+sign+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0')}
function difference(m){const a=Math.abs(m),h=Math.floor(a/60),n=a%60;return (m===0?'Same time as Egypt':(m>0?'Ahead of Egypt by ':'Behind Egypt by ')+(h?h+'h ':'')+(n?n+'m':''))}
function clockHtml(p,isEgypt){return '<div class="cityline"><div><div class="city">'+esc(p.name)+'</div><div class="zone">'+esc(p.country||p.zone)+' · '+esc(p.zone)+'</div></div>'+(isEgypt?'':'<button class="remove" data-remove="'+esc(p.zone+'|'+p.name)+'">Remove</button>')+'</div><div class="time" data-time></div><div class="date" data-date></div><div class="diff" data-diff>'+(isEgypt?'Your reference time':'')+'</div>'}
function updateClocks(){const now=new Date();document.querySelectorAll('.clock[data-zone]').forEach(card=>{const zone=card.dataset.zone;card.querySelector('[data-time]').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(now);card.querySelector('[data-date]').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:zone,weekday:'long',day:'numeric',month:'short',year:'numeric'}).format(now);if(zone!==EGYPT)card.querySelector('[data-diff]').textContent=difference(offset(now,zone)-offset(now,EGYPT))})}
function render(){const box=$('clocks');$('egyptClock').innerHTML=clockHtml({name:'Cairo, Egypt',country:'Egypt',zone:EGYPT},true);$('egyptClock').dataset.zone=EGYPT;box.querySelectorAll('.clock:not(#egyptClock)').forEach(x=>x.remove());places.forEach((p,i)=>{const card=document.createElement('article');card.className='clock';card.dataset.zone=p.zone;card.innerHTML=clockHtml(p,false);box.appendChild(card)});box.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{places=places.filter(p=>p.zone+'|'+p.name!==b.dataset.remove);save();render()}));updateClocks()}
function status(message,error){$('status').textContent=message;$('status').style.color=error?'#ff9eae':''}
async function getJson(url){const res=await fetch(url,{headers:{Accept:'application/json'}});if(!res.ok)throw new Error('Service unavailable ('+res.status+')');return res.json()}
async function resolve(feature){const props=feature.properties||{},[lon,lat]=feature.geometry.coordinates;const data=await getJson(HOURORA+'/lookup?lat='+encodeURIComponent(lat)+'&lng='+encodeURIComponent(lon));const zone=data.zone||(data.city&&data.city.zone);if(!zone)throw new Error('Could not find the time zone for this place.');return {name:props.name||props.city||props.postcode||'Selected place',country:props.country||'',zone,lat,lon}}
function add(p){if(!p||!p.zone)return;if(p.zone===EGYPT&&p.name.toLowerCase().includes('cairo')){status('Cairo is already shown as the reference clock.');return}if(places.some(x=>x.zone===p.zone&&x.name===p.name)){status('This city is already in your clocks.');return}if(places.length>=8){status('You can add up to 8 cities.',true);return}places.push(p);save();render();$('results').replaceChildren();$('query').value='';status(p.name+' added successfully.')}
$('searchForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('query').value.trim();if(q.length<2)return;$('searchButton').disabled=true;$('results').replaceChildren();status('Searching…');try{const data=await getJson(PHOTON+'?q='+encodeURIComponent(q)+'&limit=6&lang=en');const features=(data.features||[]).filter(x=>x.geometry&&x.geometry.coordinates);if(!features.length){status('No places found. Try adding a country name.',true);return}status('Choose the correct result:');features.forEach(f=>{const p=f.properties||{},b=document.createElement('button');b.className='result';const label=[p.name||p.city||p.postcode,p.city,p.state,p.country].filter((x,i,a)=>x&&a.indexOf(x)===i).join(', ');b.innerHTML='<span>'+esc(label)+'<small>'+esc([p.postcode,p.country].filter(Boolean).join(' · '))+'</small></span><span>＋</span>';b.addEventListener('click',async()=>{b.disabled=true;status('Finding time zone…');try{add(await resolve(f))}catch(err){status(err.message,true);b.disabled=false}});$('results').appendChild(b)})}catch(err){status('Search failed. Please try again.',true)}finally{$('searchButton').disabled=false}});
popular.forEach(p=>{const b=document.createElement('button');b.textContent=p.name;b.addEventListener('click',()=>add(p));$('quick').appendChild(b)});
render();setInterval(updateClocks,1000);
})();
</script>
</body>
</html>
